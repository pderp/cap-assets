<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><g font-family="DejaVu Sans, sans-serif" fill="#18252e"><rect width="1500" height="850" fill="#faf9f5"/><text x="45" y="64" font-size="40" font-weight="bold">Predictive coding supplies acquisition credit</text><text x="45" y="108" font-size="24" font-weight="normal">Mechanism tested; comparative efficacy, harm and cost pending</text><text x="45" y="151" font-size="22" font-weight="bold">DRAFT — lead review</text><rect x="45" y="240" width="380" height="285" rx="14" fill="#e0ecef"/><text x="60" y="280" font-size="25" font-weight="bold">Same teaching problem</text><text x="60" y="330" font-size="21" font-weight="normal">Prefix x, taught target y</text><text x="60" y="365" font-size="21" font-weight="normal">Same fixed base and cap</text><text x="60" y="400" font-size="21" font-weight="normal">Writes w held fixed in settling</text><rect x="475" y="185" width="495" height="190" rx="14" fill="#e0ecef"/><text x="490" y="225" font-size="25" font-weight="bold">SE-A: adjoint</text><text x="490" y="275" font-size="21" font-weight="normal">Compute task-loss derivative</text><text x="490" y="310" font-size="21" font-weight="normal">Negative normalized gradient</text><text x="490" y="345" font-size="21" font-weight="normal">Then common bounded update</text><rect x="475" y="415" width="495" height="220" rx="14" fill="#e0ecef"/><text x="490" y="455" font-size="25" font-weight="bold">SE-E: inferred errors</text><text x="490" y="505" font-size="21" font-weight="normal">E = 1/2 sum ||e||^2 + loss_y</text><text x="490" y="540" font-size="21" font-weight="normal">Zero e; 8 steps; step size 0.1</text><text x="490" y="575" font-size="21" font-weight="normal">Use normalized site error</text><rect x="1050" y="255" width="410" height="260" rx="14" fill="#e0ecef"/><text x="1065" y="295" font-size="25" font-weight="bold">Common readout</text><text x="1065" y="345" font-size="21" font-weight="normal">Bounded acquisition update</text><text x="1065" y="380" font-size="21" font-weight="normal">Efficacy + harm + cost</text><text x="1065" y="415" font-size="21" font-weight="normal">Compare SE-E minus SE-A</text><path d="M425 350 H450 V280 H470" stroke="#526675" stroke-width="2" fill="none"/><path d="M425 350 H450 V525 H470" stroke="#526675" stroke-width="2" fill="none"/><path d="M970 280 H1008 V380 H1045" stroke="#526675" stroke-width="2" fill="none"/><path d="M970 525 H1008 V380 H1045" stroke="#526675" stroke-width="2" fill="none"/><path d="M470 280 L458 273 L458 287 Z" fill="#526675"/><path d="M470 525 L458 518 L458 532 Z" fill="#526675"/><path d="M1045 380 L1033 373 L1033 387 Z" fill="#526675"/><text x="45" y="690" font-size="24" font-weight="normal">SD-24: penalize e before adding w; old write-site prior penalized e + w.</text><text x="45" y="741" font-size="22" font-weight="normal">9 forward + 9 reverse evaluations per 8-step inference; JAX autodiff. Compare efficacy, harm, cost.</text><text x="45" y="798" font-size="21" font-weight="normal">Claims: PC-mechanism, PC-SD24, PC-v0, PC-fixed-v5</text></g></svg>
