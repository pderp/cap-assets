<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><g font-family="DejaVu Sans, sans-serif" fill="#18252e"><rect width="1500" height="850" fill="#faf9f5"/><text x="45" y="64" font-size="40" font-weight="bold">Predictive coding supplies acquisition credit</text><text x="45" y="108" font-size="24" font-weight="normal">Mechanism tested; comparative efficacy, harm and cost pending</text><text x="45" y="151" font-size="22" font-weight="bold">DRAFT — lead review</text><rect x="45" y="205" width="445" height="275" rx="14" fill="#e0ecef"/><text x="63" y="254" font-size="26" font-weight="bold">Same teaching problem</text><text x="63" y="316" font-size="23" font-weight="normal">Prefix x, taught target y</text><text x="63" y="367" font-size="23" font-weight="normal">Same fixed base and cap</text><text x="63" y="418" font-size="23" font-weight="normal">Writes w held fixed in settling</text><rect x="530" y="205" width="445" height="275" rx="14" fill="#e5eddd"/><text x="548" y="254" font-size="26" font-weight="bold">SE-A: adjoint</text><text x="548" y="316" font-size="23" font-weight="normal">Compute task-loss derivative</text><text x="548" y="367" font-size="23" font-weight="normal">Negative normalized gradient</text><text x="548" y="418" font-size="23" font-weight="normal">Then common bounded update</text><rect x="1015" y="205" width="445" height="275" rx="14" fill="#f3e5d6"/><text x="1033" y="254" font-size="26" font-weight="bold">SE-E: inferred errors</text><text x="1033" y="316" font-size="23" font-weight="normal">E = 1/2 sum ||e||^2 + loss_y</text><text x="1033" y="367" font-size="23" font-weight="normal">Zero e; 8 steps; step size 0.1</text><text x="1033" y="418" font-size="23" font-weight="normal">Use normalized site error</text><path d="M496 342 H520 M981 342 H1005" stroke="#314753" stroke-width="3"/><path d="M1240 490 V543 H267 V490" stroke="#526675" stroke-width="3" stroke-dasharray="9 6" fill="none"/><text x="45" y="690" font-size="24" font-weight="normal">SD-24: penalize e before adding w; old write-site prior penalized e + w.</text><text x="45" y="741" font-size="22" font-weight="normal">9 forward + 9 reverse evaluations per 8-step inference; JAX autodiff. Compare efficacy, harm, cost.</text><text x="45" y="798" font-size="21" font-weight="normal">Claims: PC-mechanism, PC-SD24, PC-v0, PC-fixed-v5</text></g></svg>
