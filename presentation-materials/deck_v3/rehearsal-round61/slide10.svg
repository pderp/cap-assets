ion only. Separate reader training: 10/12 evaluations, two paired seeds, third pending; near-equal own-prompt retention, lower paraphrase retention, seed-dependent firing, about 100× BP training cost.</text><text x="45" y="798" font-size="21" font-weight="normal">Claims: PC-fixed-v5, PC-mechanism, HT-readout, PC-reader-partial</text></g></svg>
