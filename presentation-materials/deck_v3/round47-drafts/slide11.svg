<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><g font-family="DejaVu Sans, sans-serif" fill="#18252e"><rect width="1500" height="850" fill="#faf9f5"/><text x="45" y="64" font-size="40" font-weight="bold">What should the agent do next?</text><text x="45" y="108" font-size="24" font-weight="normal">Proposed active-inference extension; no new pre-October-9 commitment</text><text x="45" y="151" font-size="22" font-weight="bold">DRAFT — lead review</text><rect x="45" y="205" width="445" height="275" rx="14" fill="#e0ecef"/><text x="63" y="254" font-size="26" font-weight="bold">Implemented / measured</text><text x="63" y="316" font-size="23" font-weight="normal">Acquire bounded corrections</text><text x="63" y="367" font-size="23" font-weight="normal">Test retention and locality</text><text x="63" y="418" font-size="23" font-weight="normal">Measure harm distribution</text><rect x="530" y="205" width="445" height="275" rx="14" fill="#e5eddd"/><text x="548" y="254" font-size="26" font-weight="bold">PROPOSED policy model</text><text x="548" y="316" font-size="23" font-weight="normal">Beliefs + observations + actions</text><text x="548" y="367" font-size="23" font-weight="normal">Preferences: pragmatic value</text><text x="548" y="418" font-size="23" font-weight="normal">Information: epistemic value</text><rect x="1015" y="205" width="445" height="275" rx="14" fill="#f3e5d6"/><text x="1033" y="254" font-size="26" font-weight="bold">PROPOSED comparison</text><text x="1033" y="316" font-size="23" font-weight="normal">Policy-guided vs fixed audits</text><text x="1033" y="367" font-size="23" font-weight="normal">Equal audit / compute budget</text><text x="1033" y="418" font-size="23" font-weight="normal">Utility, information, harm, cost</text><path d="M496 342 H520 M981 342 H1005" stroke="#314753" stroke-width="3"/><path d="M1240 490 V543 H267 V490" stroke="#526675" stroke-width="3" stroke-dasharray="9 6" fill="none"/><text x="45" y="690" font-size="24" font-weight="normal">Learning from observed failures motivates an experiment on autonomous information seeking.</text><text x="45" y="741" font-size="22" font-weight="normal">Coupled free energy, kappa-porous blankets and the one-kappa conjecture remain proposed.</text><text x="45" y="798" font-size="21" font-weight="normal">Claims: AI-programme, AI-next, HT13-empirical, PC-v0, PC-fixed-v5</text></g></svg>
