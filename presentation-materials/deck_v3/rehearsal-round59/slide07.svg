<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><g font-family="DejaVu Sans, sans-serif" fill="#18252e"><rect width="1500" height="850" fill="#faf9f5"/><text x="45" y="64" font-size="40" font-weight="bold">What does observed tail shape add?</text><text x="45" y="108" font-size="24" font-weight="normal">Exploratory finite-range fits; primary threshold 0.01 nat</text><text x="45" y="151" font-size="22" font-weight="bold">DRAFT — lead review</text><rect x="45" y="205" width="445" height="275" rx="14" fill="#e0ecef"/><text x="63" y="254" font-size="26" font-weight="bold">Learned v5</text><text x="63" y="316" font-size="23" font-weight="normal">Illustrative 95% shape intervals</text><text x="63" y="367" font-size="23" font-weight="normal">zsRE: -0.097 to 0.177</text><text x="63" y="418" font-size="23" font-weight="normal">CF: -0.009 to 0.187</text><rect x="530" y="205" width="445" height="275" rx="14" fill="#e5eddd"/><text x="548" y="254" font-size="26" font-weight="bold">Stable v0 · zsRE</text><text x="548" y="316" font-size="23" font-weight="normal">Illustrative interval: .390–.779</text><text x="548" y="367" font-size="23" font-weight="normal">Held-out gain: .149–.594</text><text x="548" y="418" font-size="23" font-weight="normal">nats/excess across 15 cells</text><rect x="1015" y="205" width="445" height="275" rx="14" fill="#f3e5d6"/><text x="1033" y="254" font-size="26" font-weight="bold">Limits remain visible</text><text x="1033" y="316" font-size="23" font-weight="normal">Random CF: 10/15 failures</text><text x="1033" y="367" font-size="23" font-weight="normal">Mixture: all fits invalid</text><text x="1033" y="418" font-size="23" font-weight="normal">Sparse cells: no shape</text><text x="45" y="690" font-size="24" font-weight="normal">Learned v5: little predictive gain over exponential. Stable v0: a more pronounced observed tail.</text><text x="45" y="741" font-size="22" font-weight="normal">Conditional window intervals; illustrative r0/order100. No asymptotic class or infinite-variance finding.</text><text x="45" y="798" font-size="21" font-weight="normal">Claims: HT17-tails</text></g></svg>
