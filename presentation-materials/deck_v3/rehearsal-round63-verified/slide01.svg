<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><g font-family="DejaVu Sans, sans-serif" fill="#18252e"><rect width="1500" height="850" fill="#faf9f5"/><text x="45" y="64" font-size="40" font-weight="bold">Three questions for Active Inference in the Extremes</text><text x="45" y="108" font-size="24" font-weight="normal">charlie derr · October 15, 2026 · Binghamton · draft opening</text><text x="45" y="151" font-size="22" font-weight="bold">DRAFT — lead review</text><rect x="45" y="205" width="445" height="275" rx="14" fill="#e0ecef"/><text x="63" y="254" font-size="26" font-weight="bold">Active inference</text><text x="63" y="316" font-size="23" font-weight="normal">What should the agent do next?</text><text x="63" y="367" font-size="23" font-weight="normal">Beliefs, preferences, information</text><text x="63" y="418" font-size="23" font-weight="normal">PROGRAMME</text><rect x="530" y="205" width="445" height="275" rx="14" fill="#e5eddd"/><text x="548" y="254" font-size="26" font-weight="bold">Predictive coding</text><text x="548" y="316" font-size="23" font-weight="normal">How should a correction learn?</text><text x="548" y="367" font-size="23" font-weight="normal">Iterative error-inference credit</text><text x="548" y="418" font-size="23" font-weight="normal">MEASURED TRADE-OFFS</text><rect x="1015" y="205" width="445" height="275" rx="14" fill="#f3e5d6"/><text x="1033" y="254" font-size="26" font-weight="bold">Heavy-tailed distributions</text><text x="1033" y="316" font-size="23" font-weight="normal">Where do consequences fall?</text><text x="1033" y="367" font-size="23" font-weight="normal">Frequency, severity, concentration</text><text x="1033" y="418" font-size="23" font-weight="normal">MEASURED TESTBED EVIDENCE</text><text x="45" y="690" font-size="24" font-weight="normal">Frozen transformer prior + adaptive residual cap: implemented testbed for a broader proposal.</text><text x="45" y="741" font-size="22" font-weight="normal">Submitted title retained in speaker source. A coupled agent and a heavy-tail family remain unestablished.</text><text x="45" y="798" font-size="21" font-weight="normal">Claims: AI-programme, PC-v0, HT-readout</text></g></svg>
