<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><g font-family="DejaVu Sans, sans-serif" fill="#18252e"><rect width="1500" height="850" fill="#faf9f5"/><text x="45" y="64" font-size="40" font-weight="bold">A correction testbed with distinct controls</text><text x="45" y="108" font-size="24" font-weight="normal">Three realizations × five dependent orders; endpoint depends on dataset</text><text x="45" y="151" font-size="22" font-weight="bold">DRAFT — lead review</text><rect x="45" y="205" width="445" height="275" rx="14" fill="#e0ecef"/><text x="63" y="254" font-size="26" font-weight="bold">Learned-reader condition</text><text x="63" y="316" font-size="23" font-weight="normal">Frozen GPT-2 base</text><text x="63" y="367" font-size="23" font-weight="normal">Fixed BP-trained reader</text><text x="63" y="418" font-size="23" font-weight="normal">Adaptive bounded memory</text><rect x="530" y="205" width="445" height="275" rx="14" fill="#e5eddd"/><text x="548" y="254" font-size="26" font-weight="bold">Controlled comparisons</text><text x="548" y="316" font-size="23" font-weight="normal">Random reader / stable cap</text><text x="548" y="367" font-size="23" font-weight="normal">Live cap / matched update</text><text x="548" y="418" font-size="23" font-weight="normal">S1 continued-base controls</text><rect x="1015" y="205" width="445" height="275" rx="14" fill="#f3e5d6"/><text x="1033" y="254" font-size="26" font-weight="bold">Separate questions</text><text x="1033" y="316" font-size="23" font-weight="normal">Acquisition and retention</text><text x="1033" y="367" font-size="23" font-weight="normal">Locality and near misses</text><text x="1033" y="418" font-size="23" font-weight="normal">Ordinary-text probability harm</text><text x="45" y="690" font-size="24" font-weight="normal">zsRE / CounterFact: 1,000 edits. MQuAKE: descriptive at 300. This reader study uses BP, not PC credit.</text><text x="45" y="741" font-size="22" font-weight="normal">50 locality prompts do not exhaust specificity. Five orders within a realization are dependent.</text><text x="45" y="798" font-size="21" font-weight="normal">Claims: R1-design, R1-controls, R1-fidelity</text></g></svg>
