<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850"><g font-family="DejaVu Sans, sans-serif" fill="#18252e"><rect width="1500" height="850" fill="#faf9f5"/><text x="45" y="64" font-size="40" font-weight="bold">What we learned, what remains, what it took</text><text x="45" y="108" font-size="24" font-weight="normal">Measured credit and tail interventions; autonomous audit policies remain proposed.</text><text x="45" y="151" font-size="22" font-weight="bold">DRAFT — lead review</text><rect x="45" y="205" width="445" height="275" rx="14" fill="#e0ecef"/><text x="63" y="254" font-size="26" font-weight="bold">Active inference</text><text x="63" y="316" font-size="23" font-weight="normal">Concrete correction testbed</text><text x="63" y="367" font-size="23" font-weight="normal">Autonomous audit policy</text><text x="63" y="418" font-size="23" font-weight="normal">REMAINS PROPOSED</text><rect x="530" y="205" width="445" height="275" rx="14" fill="#e5eddd"/><text x="548" y="254" font-size="26" font-weight="bold">Predictive coding</text><text x="548" y="316" font-size="23" font-weight="normal">Credit: harm/cost trade-offs</text><text x="548" y="367" font-size="23" font-weight="normal">Reader: 3 seeds; ~100× cost</text><text x="548" y="418" font-size="23" font-weight="normal">CF PARAPHRASE LOSS: ALL SEEDS</text><rect x="1015" y="205" width="445" height="275" rx="14" fill="#f3e5d6"/><text x="1033" y="254" font-size="26" font-weight="bold">Extremes</text><text x="1033" y="316" font-size="23" font-weight="normal">Mixture bounds token harm</text><text x="1033" y="367" font-size="23" font-weight="normal">All ten memories pass rule</text><text x="1033" y="418" font-size="23" font-weight="normal">MEASURED; FAMILY UNPROVEN</text><text x="45" y="690" font-size="24" font-weight="normal">270-cell snapshot: 392.42 process-hours, not elapsed GPU hours. PC costs reported separately.</text><text x="45" y="741" font-size="22" font-weight="normal">GPT-2 small (124M). GPU work complete Oct 4; review freeze Oct 9; talk Oct 15. Upper-layer results in backup.</text><text x="45" y="798" font-size="21" font-weight="normal">Claims: AI-next, PC-depth, PC-budget, AW-B, HT13-corrected, talk-scope, model-scale, PC-reader, R-extension, AW-L</text></g></svg>
