  </g>
  <g id="text_2">
   <text style="font-weight: 700; font-size: 36px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d3b" x="56" y="95.933125" transform="rotate(-0 56 95.933125)">21 · Training the reader with PC gave mixed outcomes</text>
  </g>
  <g id="text_3">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(74 640.627656)">CounterFact paraphrase retention fell in every pair. Its ordinary-text harm changed direction</text>
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(74 668.574063)">across seeds.</text>
  </g>
  <g id="text_4">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52646b" x="58" y="700.800313" transform="rotate(-0 58 700.800313)">Source: PC-reader report, 12 completed evaluations. Training seeds reuse one subject population; bars share 0–100%.</text>
  </g>
  <g id="text_5">
   <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 179.491562)">Three paired training seeds, the same 300 updates and 3.35M reader parameters. All evaluations</text>
   <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 207.781562)">use adjoint acquisition and 300 edits.</text>
  </g>
