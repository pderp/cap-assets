  <g id="text_1">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f7d" x="56" y="42.279219" transform="rotate(-0 56 42.279219)">4 / What we learned</text>
  </g>
  <g id="text_2">
   <text style="font-weight: 700; font-size: 36px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d3b" x="56" y="95.933125" transform="rotate(-0 56 95.933125)">16 · The mixture reduced severity to about one-third</text>
  </g>
  <g id="text_3">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(74 640.627656)">This is a measured reduction in the severity of unintended changes, with a small editing</text>
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(74 668.574063)">trade-off.</text>
  </g>
  <g id="text_4">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52646b" x="58" y="700.800313" transform="rotate(-0 58 700.800313)">Source: AW-B evaluation and HT-17. Mixture selected on development data; bars share a zero origin and scale.</text>
  </g>
  <g id="text_5">
   <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 179.491562)">Mean loss increase among positions with Δ &gt; 0.01 nat, on ten exposed memories: two datasets ×</text>
   <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 210.009687)">five orders at 300 edits.</text>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52646b" x="58" y="254.056016" transform="rotate(-0 58 254.056016)">Dataset</text>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f7d" x="370" y="252.433594" transform="rotate(-0 370 252.433594)">Original cap</text>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6852a2" x="802" y="252.433594" transform="rotate(-0 802 252.433594)">Probability mixture</text>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d3b" x="66" y="306.370859" transform="rotate(-0 66 306.370859)">zsRE</text>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f7d" x="370" y="303.455859" transform="rotate(-0 370 303.455859)">1.619 nats</text>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6852a2" x="802" y="303.466641" transform="rotate(-0 802 303.466641)">0.542 nats</text>
  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d3b" x="66" y="395.508672" transform="rotate(-0 66 395.508672)">CounterFact</text>
  </g>
  <g id="text_13">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f7d" x="370" y="392.466641" transform="rotate(-0 370 392.466641)">1.925 nats</text>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6852a2" x="802" y="392.466641" transform="rotate(-0 802 392.466641)">0.581 nats</text>
  </g>
  <g id="text_15">
   <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 483.659688)">All ten memories met the declared retention-and-preservation rule. Paraphrase retention was unchanged on</text>
   <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 509.489688)">zsRE and fell by 0.67–1.17 percentage points on CounterFact.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d3b" x="58" y="545.319688" transform="rotate(-0 58 545.319688)">Harm frequency barely changed. CounterFact mean KL still exceeded 0.001.</text>
  </g>
