  <g id="text_1">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f7d" x="56" y="42.279219" transform="rotate(-0 56 42.279219)">4 / What we learned</text>
  </g>
  <g id="text_2">
   <text style="font-weight: 700; font-size: 36px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d3b" x="56" y="95.933125" transform="rotate(-0 56 95.933125)">11 · Learning the reader improves paraphrase retention</text>
  </g>
  <g id="text_3">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(74 640.627656)">The cap often carries an answer beyond its teaching prompt. The strength of that transfer</text>
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(74 666.539688)">depends on the dataset.</text>
  </g>
  <g id="text_4">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52646b" x="58" y="700.800313" transform="rotate(-0 58 700.800313)">Source: Stage-4 triplet summary. Bars start at zero on a common 0–100% scale; ranges are descriptive.</text>
  </g>
  <g id="text_5">
   <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 179.491562)">Retained paraphrase score, averaged over orders within each realization, then over the three</text>
   <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 207.781562)">realizations. Higher is better.</text>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52646b" x="58" y="252.507812" transform="rotate(-0 58 252.507812)">Dataset and endpoint</text>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f7d" x="350" y="254.348437" transform="rotate(-0 350 254.348437)">Learned reader</text>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6852a2" x="644.666667" y="254.348437" transform="rotate(-0 644.666667 254.348437)">Random reader</text>
  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #78888d" x="939.333333" y="252.507812" transform="rotate(-0 939.333333 252.507812)">Stable v0 cap</text>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d3b" x="66" y="305.352031" transform="rotate(-0 66 305.352031)">zsRE · 1,000 edits</text>
  </g>
  <g id="text_11">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f7d" x="350" y="303.466641" transform="rotate(-0 350 303.466641)">96.0%</text>
  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6852a2" x="644.666667" y="303.466641" transform="rotate(-0 644.666667 303.466641)">52.4%</text>
  </g>
  <g id="text_13">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #78888d" x="939.333333" y="303.466641" transform="rotate(-0 939.333333 303.466641)">18.6%</text>
  </g>
  <g id="text_14">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(66 391.296641)">CounterFact · 1,000</text>
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(66 418.654063)">edits</text>
  </g>
  <g id="text_15">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f7d" x="350" y="389.596641" transform="rotate(-0 350 389.596641)">67.8%</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6852a2" x="644.666667" y="389.596641" transform="rotate(-0 644.666667 389.596641)">12.1%</text>
  </g>
  <g id="text_17">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #78888d" x="939.333333" y="389.596641" transform="rotate(-0 939.333333 389.596641)">0.0%</text>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d3b" x="66" y="477.571016" transform="rotate(-0 66 477.571016)">MQuAKE · 300 edits</text>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f7d" x="350" y="475.726641" transform="rotate(-0 350 475.726641)">71.6%</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6852a2" x="644.666667" y="475.726641" transform="rotate(-0 644.666667 475.726641)">0.0%</text>
  </g>
  <g id="text_21">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #78888d" x="939.333333" y="475.726641" transform="rotate(-0 939.333333 475.726641)">0.0%</text>
  </g>
  <g id="text_22">
   <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 564.049688)">The learned-reader realization means span 95.5–96.5% on zsRE, 66.6–69.2% on CounterFact and 70.3–72.3%</text>
   <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 590.524453)">on MQuAKE.</text>
  </g>
 </g>
