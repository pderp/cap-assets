  </g>
  <g id="text_12">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d3b" x="66" y="392.824062" transform="rotate(-0 66 392.824062)">Seed 1</text>
