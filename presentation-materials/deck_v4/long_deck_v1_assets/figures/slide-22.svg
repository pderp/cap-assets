  <g id="text_1">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f7d" x="56" y="42.279219" transform="rotate(-0 56 42.279219)">4 / What we learned</text>
  </g>
  <g id="text_2">
   <text style="font-weight: 700; font-size: 36px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d3b" x="56" y="95.933125" transform="rotate(-0 56 95.933125)">22 · The reader-training cost difference was large</text>
  </g>
  <g id="text_3">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(74 640.627656)">The installed ePC training procedure was substantially more expensive, without a consistent</text>
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(74 666.457656)">efficacy-and-harm gain.</text>
  </g>
  <g id="text_4">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52646b" x="58" y="700.800313" transform="rotate(-0 58 700.800313)">Source: Completed PC-reader process receipts. Acquisition and evaluation are separate; bars share a zero origin and scale.</text>
  </g>
  <g id="text_5">
   <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 179.491562)">Whole-training process time for the same 300 updates, including construction and caching. Each</text>
   <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 207.781562)">pair starts from matched parameters.</text>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52646b" x="58" y="252.433594" transform="rotate(-0 58 252.433594)">Training seed</text>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f7d" x="370" y="252.433594" transform="rotate(-0 370 252.433594)">Backpropagation</text>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6852a2" x="802" y="252.433594" transform="rotate(-0 802 252.433594)">Error-inference training</text>
  </g>
