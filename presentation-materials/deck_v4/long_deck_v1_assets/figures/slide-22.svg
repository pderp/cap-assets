  <g id="text_17">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #6852a2" x="802" y="475.929688" transform="rotate(-0 802 475.929688)">23.432 h</text>
  </g>
  <g id="text_18">
   <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 564.049688)">Measured paired cost ratios: 102.1×, 95.8× and 96.7×. Backpropagation took about 14–15 minutes per</text>
   <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 589.879688)">reader; ePC took about a day.</text>
  </g>
