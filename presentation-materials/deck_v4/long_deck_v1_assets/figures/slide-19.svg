  <g id="text_22">
   <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 564.049688)">Mean ordinary-text loss increase rose from 0.00145 to 0.00221 nats between one and 32 steps. CounterFact</text>
   <text style="font-size: 21px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 589.879688)">paraphrase retention stayed at zero.</text>
