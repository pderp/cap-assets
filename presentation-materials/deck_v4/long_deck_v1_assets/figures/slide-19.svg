  <g id="text_1">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007f7d" x="56" y="42.279219" transform="rotate(-0 56 42.279219)">4 / What we learned</text>
  </g>
  <g id="text_2">
   <text style="font-weight: 700; font-size: 36px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #142d3b" x="56" y="95.933125" transform="rotate(-0 56 95.933125)">19 · More settling bought retention at a cost</text>
  </g>
  <g id="text_3">
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(74 640.627656)">More inference preserved more teaching prompts, but did not establish better transfer or</text>
   <text style="font-weight: 700; font-size: 21px; font-family: 'DejaVu Sans'; fill: #ffffff" transform="translate(74 668.574063)">lower harm.</text>
  </g>
  <g id="text_4">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52646b" x="58" y="700.800313" transform="rotate(-0 58 700.800313)">Source: PC-controls report. Means over three realizations; timing is learning only, not whole-process time.</text>
  </g>
  <g id="text_5">
   <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 179.491562)">Legacy 50M ePC base with the v0 live cap: zsRE, three exposed realizations, order 100, after 1,000</text>
   <text style="font-size: 23px; font-family: 'DejaVu Sans'; fill: #142d3b" transform="translate(58 210.009687)">edits.</text>
  </g>
  <g id="text_6">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52646b" x="58" y="252.433594" transform="rotate(-0 58 252.433594)">Settling steps</text>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; fill: #007f7d" transform="translate(350 252.433594)">Original-prompt</text>
   <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; fill: #007f7d" transform="translate(350 277.718437)">retention</text>
  </g>
  <g id="text_8">
